[tool.flake8]
max-line-length = 79
exclude = [".git", "__pycache__", ".venv"]
#extend-ignore = ["E203"]


[tool.pylint]
max-line-length = 79

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "broad-exception-caught",     # need to delete for production
]

#[tool.pylint.format]
#max-line-length = 120


[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 79


[tool.black]
line-length = 79
target-version = ["py314"]
#include = "\.pyi?$"
extend-exclude = '''
/(
  .git | \.venv | __pycache__ | migrations
)
'''
